# The offscreen suite on every push to main and every pull request
# (README → Tests): on Arch, which is what Omarchy is, and on Windows, for
# the host that stands in for omarchy-shell there.
#
# Not run here, for want of a desktop: `test_popup` (the bar's popup, drawn
# by quickshell under the installed shell on a running Hyprland), and the
# live page test in Quickshell (`--page`, a Hyprland of its own nested in a
# session). Those stay with a machine that has one:
# `python3 tests/run_all.py --page`. The same live page test does run here
# on Windows, over the Windows host (`tests/page/run.py --host qt`,
# offscreen): the page's own logic, driven over IPC, on Windows' processes,
# files and paths.
name: tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Arch
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      # What the suite calls, by Arch's names: qmltestrunner (qt6-declarative),
      # PyQt6 for test_cursors, gitleaks and pdftotext for what the agent
      # holds back and reads, node for the halves written twice, a font for
      # Qt to lay text out in. pandoc and xelatex are left out: test_export
      # says so and passes over the PDF itself.
      - name: The tools the suite calls
        run: >
          pacman -Syu --noconfirm --needed
          git python python-pyqt6 qt6-declarative qt6-svg
          gitleaks poppler nodejs ttf-dejavu
      - uses: actions/checkout@v4
      - name: The offscreen suite
        env:
          LANG: C.UTF-8
          QT_QPA_PLATFORM: offscreen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          names=$(python3 tests/run_all.py --list | awk '{print $1}' | grep -vxE 'popup|page' | sort -u)
          python3 tests/run_all.py $names

  windows:
    # Two halves side by side on the same setup: the offscreen suite, and
    # the live page test over the Windows host (tests/page/run.py).
    name: Windows (${{ matrix.part }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [suite, page]
    steps:
      - uses: actions/checkout@v4
      # The Windows host lives in windows/ and tests/windows/. A tree from
      # before it has nothing for this job to run, and the job says so.
      - name: Is the Windows host in this tree?
        id: host
        shell: bash
        run: |
          if [ -f tests/windows/sitecustomize.py ] && [ -f windows/pyproject.toml ]; then
            echo "here=true" >> "$GITHUB_OUTPUT"
          else
            echo "here=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Windows host in this tree (windows/, tests/windows/): nothing run on Windows."
          fi
      - if: steps.host.outputs.here == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # As windows/README.md installs it: a Python of Longhand's own with
      # PySide6 and the launchers (test_cursors runs on PySide6 here, the
      # host's own Qt); gitleaks and poppler as the agent's extras. Git for Windows (bash, GNU date)
      # and node are the runner's own.
      #
      # pwsh goes on past a native command that fails, so each one is checked.
      # Chocolatey's feed answers 504 now and then, and choco then passes over
      # the package it could not find and still exits 0, leaving the suite to
      # fail later on papers with no text. So it is tried again, then taken
      # from the tools' own releases, and the step fails here, by name, if
      # gitleaks or poppler's pdftotext is still missing.
      - name: Longhand's Python and the tools the suite calls
        if: steps.host.outputs.here == 'true'
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv\Scripts\python -m pip install --quiet -e windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # What the suite needs: gitleaks, and poppler's own pdftotext (a
          # pdftotext of another make reads papers otherwise, and the paper
          # tests fail on its text).
          function Missing {
            $m = @()
            if (-not (Get-Command gitleaks -ErrorAction SilentlyContinue)) { $m += 'gitleaks' }
            $pt = if (Get-Command pdftotext -ErrorAction SilentlyContinue) { (& pdftotext -v 2>&1 | Out-String) } else { '' }
            if ($pt -notmatch '(?i)poppler') { $m += 'poppler' }
            return $m
          }
          foreach ($try in 1..3) {
            choco install gitleaks poppler --no-progress -y
            $missing = Missing
            if (-not $missing) { break }
            if ($try -lt 3) {
              Write-Output "::warning::Not there after try $try ($($missing -join ', ')): trying again"
              Start-Sleep -Seconds (30 * $try)
            }
          }
          # Each has a release of its own on GitHub, at the version Chocolatey
          # pins: taken from there when its feed is down (2026-11-25: 503 and
          # 504 on every try, three runs running).
          function FromRelease($name, $url) {
            $dir = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $zip = Join-Path $dir "$name.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $exe = Get-ChildItem -Path $dir -Recurse -Filter "$(if ($name -eq 'poppler') { 'pdftotext' } else { $name }).exe" | Select-Object -First 1
            $bin = $exe.DirectoryName
            $env:Path = "$bin;$env:Path"
            Add-Content -Path $env:GITHUB_PATH -Value $bin
            Write-Output "::warning::$name taken from its GitHub release (Chocolatey's feed did not answer)"
          }
          if ($missing -contains 'gitleaks') {
            FromRelease 'gitleaks' 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip'
          }
          if ($missing -contains 'poppler') {
            FromRelease 'poppler' 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip'
          }
          $missing = Missing
          if ($missing) {
            Write-Output "::error::Still missing after Chocolatey and the releases: $($missing -join ', ')"
            exit 1
          }
          # Both are there: choco's own code (3010 asks for a reboot) is not the step's.
          $global:LASTEXITCODE = 0
      - name: The suite
        if: steps.host.outputs.here == 'true' && matrix.part == 'suite'
        shell: pwsh
        run: .venv\Scripts\python -X utf8 tests\run_all.py
      # The page as it runs on Omarchy, every check of it, over the host
      # that stands in for Quickshell. A tree from before --host qt has
      # nothing to run here.
      # What the page said and every process it started (PAGE_LOG,
      # LONGHAND_HOST_TRACE) are kept, and handed back when it fails: a
      # check that fails only here can then be read, not guessed at.
      - name: The page, live, over the Windows host
        if: steps.host.outputs.here == 'true' && matrix.part == 'page' && hashFiles('tests/page/qt_host.py') != ''
        shell: pwsh
        env:
          PAGE_LOG: ${{ runner.temp }}\page.log
          LONGHAND_HOST_TRACE: "1"
        run: .venv\Scripts\python -X utf8 -u tests\page\run.py --host qt
      - name: What the page said, when it failed
        if: failure() && matrix.part == 'page'
        uses: actions/upload-artifact@v4
        with:
          name: page-log
          path: ${{ runner.temp }}/page.log
          if-no-files-found: ignore
