<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- The five looks of blank.html side by side, each under its name. -->
<style>
  body { margin: 0; background: #1A1A17; font-family: "Adwaita Sans"; display: flex; gap: 26px; padding: 26px 28px 28px; width: max-content; }
  figure { margin: 0; }
  figcaption { color: #EFEDE4; font-size: 19px; margin-bottom: 4px; }
  figcaption small { display: block; color: #A6A99E; font-size: 14px; margin-top: 3px; height: 40px; width: 620px; line-height: 1.4; }
  iframe { width: 622px; height: 1200px; border: 0; display: block; }
</style>
</head>
<body>
  <figure><figcaption>Now (as built)<small>Pinned to the foot: on a new day the days before fill the pane.</small></figcaption><iframe src="blank.html?v=now"></iframe></figure>
  <figure><figcaption>A · starts at today<small>Opens with today's rule at the top; the days before are above, out of sight. Only the scroll bar says so.</small></figcaption><iframe src="blank.html?v=a"></iframe></figure>
  <figure><figcaption>A · scrolled up a little<small>The same pane after a few wheel ticks up: Friday comes down from above, as in any chat.</small></figcaption><iframe src="blank.html?v=a-up"></iframe></figure>
  <figure><figcaption>B · one quiet line<small>Blank, with one faint line saying the days before are there and how to reach them.</small></figcaption><iframe src="blank.html?v=b"></iframe></figure>
  <figure><figcaption>C · yesterday's last words, faded<small>Blank below; just the end of yesterday showing under the head, fading out.</small></figcaption><iframe src="blank.html?v=c"></iframe></figure>
</body>
</html>
