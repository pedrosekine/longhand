<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- The four looks of mock.html side by side, each under its name. -->
<style>
  body { margin: 0; background: #1A1A17; font-family: "Adwaita Sans"; display: flex; gap: 28px; padding: 26px 28px 28px; width: max-content; }
  figure { margin: 0; }
  figcaption { color: #EFEDE4; font-size: 19px; margin-bottom: 4px; }
  figcaption small { display: block; color: #A6A99E; font-size: 14px; margin-top: 3px; height: 40px; width: 620px; line-height: 1.4; }
  iframe { width: 622px; height: 1200px; border: 0; display: block; }
</style>
</head>
<body>
  <figure><figcaption>Now<small>Fourteen earlier days, a line each, counted in subjects and turns.</small></figcaption><iframe src="mock.html?v=now"></iframe></figure>
  <figure><figcaption>A · one chat, scroll up<small>The conversation itself: yesterday's last turns, a rule, today. Scrolling up goes on into the days before.</small></figcaption><iframe src="mock.html?v=a"></iframe></figure>
  <figure><figcaption>B · no history here<small>Only today. A thing's past turns show when you are on it ("about this"); the agent remembers either way.</small></figcaption><iframe src="mock.html?v=b"></iframe></figure>
  <figure><figcaption>C · named, last three days<small>What each day was about, by name; older days behind one line.</small></figcaption><iframe src="mock.html?v=c"></iframe></figure>
</body>
</html>
