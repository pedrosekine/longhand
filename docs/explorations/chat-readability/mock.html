<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  Chat readability mockups (2026-11-19). One page, four looks, picked by
  the query string: ?v=now | a | b | c. Rendered to PNG with headless
  chromium (render.sh). Colours: the Birnbaum theme's colors.toml.
-->
<style>
  @font-face { font-family: "QuattroR"; src: url("file:///usr/share/fonts/ttf-ia-writer/iAWriterQuattroS-Regular.ttf"); }
  @font-face { font-family: "MonoR"; src: url("file:///usr/share/fonts/ttf-ia-writer/iAWriterMonoS-Regular.ttf"); }
  :root {
    --bg: #2A2A25; --sunk: #20201C; --fg: #EFEDE4; --dim: #A6A99E; --faint: #787A6F;
    --accent: #F5845B; --sel: #5B3A33; --rule: #3A3A33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { width: 620px; height: 1200px; overflow: hidden; position: relative;
         border-left: 1px solid #38382F; }
  .head { position: absolute; top: 0; left: 0; right: 0; height: 70px; padding: 32px 30px 0;
          font: 14px "MonoR"; letter-spacing: 1.4px; color: var(--faint); text-transform: uppercase;
          background: var(--bg); z-index: 2; }
  .scroll { position: absolute; top: 70px; left: 30px; right: 30px; bottom: 132px; overflow: hidden;
            display: flex; flex-direction: column; justify-content: flex-end; }
  .foot { position: absolute; left: 30px; right: 30px; bottom: 26px; }
  .box { border: 1px solid #5a5a50; height: 46px; padding: 11px 14px; color: var(--faint); font-size: 17px; }
  .hint { margin-top: 12px; color: var(--faint); font-size: 14px; line-height: 1.35; }

  /* ---------- NOW: as drawn on 2026-11-19 ---------- */
  .now { font-family: "QuattroR"; }
  .now .turn { margin-bottom: 4px; }
  .now .agent p { margin: 0; font-size: 19px; line-height: 27px; }
  .now .agent q { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; quotes: "“" "”"; }
  .now .rate { font-size: 14px; color: var(--faint); margin: 4px 0 26px; word-spacing: 6px; }
  .now .rate span + span { margin-left: 8px; }
  .now .ref { text-align: right; font-size: 14px; color: var(--faint); white-space: nowrap; overflow: hidden;
              text-overflow: ellipsis; margin-bottom: 6px; }
  .now .me { margin-left: auto; width: fit-content; max-width: 448px; background: rgba(245,132,91,.14);
             padding: 6px 14px; border-radius: 0; font-size: 19px; line-height: 27px; margin-bottom: 20px; }
  .now .cite { }
  .now .box { font-family: "QuattroR"; letter-spacing: .5px; }
  .now .hint { font-family: "QuattroR"; }

  /* ---------- A, B, C share the new type and rhythm ---------- */
  .new { font-family: "Adwaita Sans"; }
  .new .agent p { margin: 0 0 12px; font-size: 17px; line-height: 1.62; color: #E6E4DA;
                  font-feature-settings: "ss02" 0; }
  .new .agent p:last-child { margin-bottom: 0; }
  .new .turn { margin-bottom: 34px; }
  .new .turn.agent { position: relative; }
  .new .rate { font-size: 13px; color: var(--faint); margin-top: 8px; height: 18px; }
  .new .rate .k { border: 1px solid #4A4A41; border-radius: 3px; padding: 0 5px; margin-right: 4px; font-family: "MonoR"; font-size: 11px; }
  .new .rate.hidden { visibility: hidden; }
  .new .ask { margin-left: auto; width: fit-content; max-width: 470px; }
  .new .ref { font-size: 13.5px; line-height: 1.45; color: var(--dim); border-left: 2px solid var(--accent);
              padding: 1px 0 1px 10px; margin: 0 0 8px; font-family: "Adwaita Sans"; }
  .new .ref b { font-weight: 500; color: var(--faint); margin-right: 6px; font-size: 12.5px; letter-spacing: .3px; }
  .new .me { background: rgba(245,132,91,.12); padding: 10px 15px; border-radius: 10px; font-size: 17px;
             line-height: 1.55; }
  .new .box { font-family: "Adwaita Sans"; border-radius: 8px; border-color: #4f4f46; }
  .new .hint { font-family: "Adwaita Sans"; font-size: 13px; white-space: nowrap; }

  /* A: citations still as now, only quieter: body colour, dotted rule */
  .a .agent q { color: inherit; quotes: "“" "”"; text-decoration: underline dotted rgba(245,132,91,.55);
                text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
  .a .cite { color: var(--accent); font-size: 14px; }

  /* B: the quote reads as prose, the page is the only mark */
  .b .agent q { quotes: "“" "”"; font-style: normal; }
  .b .cite, .c .cite { display: inline-block; font-size: 12px; line-height: 1; padding: 3px 6px 3px; border-radius: 5px;
                 background: rgba(245,132,91,.16); color: var(--accent); vertical-align: 2px; margin-left: 3px;
                 font-variant-numeric: tabular-nums; letter-spacing: .2px; }
  .b q.hover { background: rgba(91,58,51,.9); border-radius: 2px; box-shadow: 0 0 0 2px rgba(91,58,51,.9); }

  /* C: the answer first, the paper's words under it */
  .c .ev { margin: 4px 0 12px; padding: 2px 0 2px 13px; border-left: 2px solid #55554b; font-size: 15.5px;
           line-height: 1.55; color: #CFCDC3; }
  .c .ev + .ev { margin-top: -4px; }
  .c .ev q { quotes: "“" "”"; }
</style>
</head>
<body>
<div class="head">Chat · lindqvist2025walking.pdf</div>
<div class="scroll" id="scroll"></div>
<div class="foot">
  <div class="box">ask about this paper…</div>
  <div class="hint" id="hint"></div>
</div>
<script>
const v = (location.search.match(/v=(\w+)/) || [, "now"])[1];
document.body.className = v === "now" ? "now" : "new " + v;

// A made-up paper and conversation, the same shape and length as the one in
// the 2026-11-19 screenshot that started this (three questions on passages,
// answers quoting the paper with their pages).
const turns = [
  { me: "so most of the sensor data was unreliable?", ref: ["p. 6", "Of roughly 38,000 readings, 6,210 were kept…"] },
  { agent: [
    'No. To compare like with like, they kept a reading only when the walker was moving: <q>stationary periods were excluded from the analysis</q>{p. 5}. Of <q>roughly 38,000 readings</q>, 6,210 remained{p. 6}.',
    'So most of the data wasn’t faulty; it was set aside so every route counted the same. The cost, by their own account, is that the shaded stops where people paused are missing from the model{p. 12}.'
  ], c: [
    'No — it was set aside, not thrown out as bad. They kept a reading only when the walker was moving, so every route counted the same. Of about 38,000 readings, 6,210 remained.',
    '>stationary periods were excluded from the analysis{p. 5}',
    'The cost, by their own account: the shaded stops where people paused are missing from the model{p. 12}.'
  ]},
  { me: "did they give people a map or did someone walk with them to keep them on the route the whole time?", ref: ["p. 4", "Each walk followed a marked route through the…"] },
  { agent: [
    'The methods don’t say whether anyone walked with the participants or handed them a map. The authors write that participants <q>followed a marked route of 3.4 km through the district</q>{p. 4}, but not how the route was marked.',
    'The phone app logged position to place each reading, and the 15 m rule was applied afterwards to clean the track — not to guide anyone.'
  ], c: [
    'The paper doesn’t say. Walkers followed a marked 3.4 km route, but the methods never describe how it was marked or whether anyone came along.',
    '>followed a marked route of 3.4 km through the district{p. 4}',
    'Position was only logged, by the phone app; the 15 m rule cleaned the track afterwards. It didn’t steer anyone.'
  ]},
  { me: "so this is the same model they mention right at the start of the paper?", ref: ["p. 7", "a gradient-boosted classifier"] },
  { agent: [
    'Yes — it is the <q>off-the-shelf gradient-boosted model</q>{p. 2} from the introduction.',
    'In §3.4 they train it on the street images and the sensor readings together: <q>a gradient-boosted classifier is fitted to the combined feature set of both sources</q>{p. 7}.',
    'It ranks which street features matter; it doesn’t measure heat itself.'
  ], c: [
    'Yes. It’s the same model, trained in §3.4 on the street images and the sensor readings together.',
    '>off-the-shelf gradient-boosted model{p. 2}',
    '>a gradient-boosted classifier is fitted to the combined feature set of both sources{p. 7}',
    'It only ranks which street features matter; it doesn’t measure heat itself.'
  ]},
];

function cite(s, mode) {
  return s.replace(/\{(p\. \d+)\}/g, (m, p) =>
    mode === "now" ? ` (${p})` : mode === "a" ? ` <span class="cite">(${p})</span>` : `<span class="cite">${p}</span>`);
}

const root = document.getElementById("scroll");
let html = "";
const lastAgent = turns.map((t, i) => t.agent ? i : -1).filter(i => i >= 0).pop();
turns.forEach((t, i) => {
  if (t.me) {
    if (v === "now") {
      html += `<div class="ref">↳ ${t.ref[0]} “${t.ref[1]}”</div><div class="me">${t.me}</div>`;
    } else {
      html += `<div class="turn ask"><div class="ref"><b>${t.ref[0].toUpperCase()}</b>${t.ref[1]}</div><div class="me">${t.me}</div></div>`;
    }
  } else {
    let paras;
    if (v === "now") {
      paras = `<p>${cite(t.agent.join(" "), "now")}</p>`;
      html += `<div class="turn agent">${paras}</div><div class="rate"><span>helpful</span><span>not helpful</span></div>`;
      return;
    }
    if (v === "c") {
      paras = t.c.map(s => s[0] === ">" ? `<div class="ev"><q>${cite(s.slice(1).replace(/\{/, "</q>{"), "c")}</div>` : `<p>${cite(s, "c")}</p>`).join("");
      paras = paras.replace(/<\/q>(<span class="cite">[^<]*<\/span>)<\/q>/g, "</q>$1");
    } else {
      paras = t.agent.map(s => `<p>${cite(s, v)}</p>`).join("");
    }
    if (v === "b" && i === 3) paras = paras.replace("<q>were", '<q class="hover">were');
    const rate = i === lastAgent
      ? `<div class="rate"><span class="k">+</span>helpful &nbsp; <span class="k">−</span>not helpful</div>`
      : `<div class="rate hidden">.</div>`;
    html += `<div class="turn agent">${paras}${rate}</div>`;
  }
});
root.innerHTML = html;
document.getElementById("hint").textContent = v === "now"
  ? "Enter sends · ^ attaches a mark · quotes link to the page · Esc back to the marks"
  : "Enter sends   ·   ^ attaches a mark   ·   Esc back to the marks";
</script>
</body>
</html>
